; Flaschen-Unscrambler K-3906.004 -> KE-50
; Bauen:  cd firmware && pio run          Flashen: pio run -t upload    Monitor: pio device monitor
[platformio]
src_dir = unscrambler

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    gin66/FastAccelStepper@0.31.3
build_flags = -Wall -Wextra -Wno-unused-parameter
